[project]
name = "docx-extract"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Trần Thanh Quang", email = "quang.tranthanh@vnpt.vn" }
]
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.1",
    "requests>=2.32.0",
]

[project.scripts]
docx-extract = "docx_extract:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
